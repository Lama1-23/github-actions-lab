name: Test and Deploy Real Project

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Run Dummy Tests
        run: |
          echo "Simulating tests on Python ${{ matrix.python-version }}..."
          echo "All tests passed successfully!"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploying Project
        run: |
          echo "Deploying the site to production because all matrix tests passed!"
