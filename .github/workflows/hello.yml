name: Advanced GitHub Automation

on:
  push:
    branches:
      - main
      - feature/app
  workflow_dispatch:

jobs:
  test-environment:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python Version
        run: python --version

  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Try to read secret
        env:
          SECRET_DATA: ${{ secrets.MY_SECRET_TOKEN }}
        run: |
          echo "GitHub will mask this secret"
          echo "The secret token is: $SECRET_DATA"
